[project]
name = "discord-ai-bot"
version = "1.0.0"
description = "An AI-first Discord chatbot with file-based coding, scoped owner-controlled context, and safe file handling."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MPL-2.0" }
dependencies = [
    "discord.py>=2.4,<3",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
discord-ai-bot = "bot:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools]
py-modules = ["bot", "config", "discord_client"]
packages = ["ai", "context", "files", "database", "sandbox"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
